<!--
なぜ resources/static に入れるとうまくいく？
👉 Spring Bootが「ここにあるファイルはそのまま配信する（静的ファイル置き場）」と決めているから
-->

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Task App</title>
</head>
<body>

<h1>タスク追加</h1>

<input type="text" id="taskInput" placeholder="タスクを入力">
<button type="button" onclick="addTask()">追加</button>

<h2>タスク一覧</h2>
<ul id="taskList"></ul>

<script>
    async function addTask() {
        const input = document.getElementById("taskInput");
        const task = input.value;

        await fetch("/tasks", {
            //送信
            method: "POST",
            //JSON形式でデータを送るよ
            headers: {
                "Content-Type": "application/json"
            },
            //送る中身
            body: JSON.stringify({title: task})
        });

        input.value = "";
        await loadTasks();
    }

    //タスク一覧を更新して表示
    async function loadTasks() {
        const response = await fetch("/tasks");
        /*
        もしJSON.parse使うなら👇
        const text = await response.text();
        const tasks = JSON.parse(text);
         */
        const tasks = await response.json();

        const list = document.getElementById("taskList");
        list.innerHTML = "";

        tasks.forEach(t => {
            const li = document.createElement("li");
            li.textContent = `${t.id}: ${t.title}`;

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = `削除`;
            //() => : アロー関数。後ろの処理を実行する
            //deleteBtn.onclick = 関数の処理
            //というように、JavaScriptでは関数を値として渡せる
            //ここ重要！！！
            deleteBtn.onclick = () => deleteTask(t.id);
            li.appendChild(deleteBtn);

            const toggleBtn = document.createElement("button");
            //三項演算子
            toggleBtn.textContent = t.completed ? "完了" : "未完了";
            /*
            アロー関数をつけることで、ボタンが押されたらtoggleTaskを実行してねという意味になる。
            toggleBtn.onclick = toggleTask(t.id);としてはいけない。
            いまloadTasksの中でtoggleTaskを呼んでいるが、toggleTaskのなかでloadTasksもよばれているため。
             */
            toggleBtn.onclick = () => toggleTask(t.id);
            li.appendChild(toggleBtn);


            list.appendChild(li);
        });
    }

    async function deleteTask(id) {
        await fetch(`/tasks/${id}`, {
            method: "DELETE"
        });
        await loadTasks();
    }

    async function toggleTask(id) {
        await fetch(`/tasks/${id}/toggle`, {
            method: "PATCH"
        });
        await loadTasks();
    }

    // 初期読み込み
    loadTasks();
</script>

</body>
</html>
